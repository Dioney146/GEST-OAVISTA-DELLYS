<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão a Vista – Delly's</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- LOGIN -->
<div id="tela-login" class="login-wrap" hidden>
  <form id="form-login" class="login-card" autocomplete="off">
    <div class="logo">
      <img src="https://is4-ssl.mzstatic.com/image/thumb/Purple126/v4/13/93/57/139357e7-7bd2-43b9-1b59-8a6ffb9665a9/source/512x512bb.jpg" alt="">
      <div><div class="t1">DELLY'S</div><div class="t2">Gestão a Vista</div></div>
    </div>
    <h1>🔒 Acesso restrito</h1>
    <p>Entre com a senha do seu estado (ou do administrador).</p>
    <label class="campo"><span>Quem está acessando?</span>
      <select id="login-usuario" class="input"></select>
    </label>
    <label class="campo"><span>Senha</span>
      <input id="login-senha" class="input" type="password" autocomplete="current-password">
    </label>
    <div id="login-erro" class="erro"></div>
    <button id="login-btn" class="btn full" type="submit">Entrar</button>
  </form>
</div>

<!-- APP -->
<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar">
    <div class="logo">
      <img src="https://is4-ssl.mzstatic.com/image/thumb/Purple126/v4/13/93/57/139357e7-7bd2-43b9-1b59-8a6ffb9665a9/source/512x512bb.jpg" alt="">
      <div><div class="t1">DELLY'S</div><div class="t2">Gestão a Vista</div></div>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="sessao">
      Logado como: <b id="sessao-nome"></b>
      <button id="btn-sair" class="btn ghost full" type="button">Sair</button>
    </div>
  </aside>
  <main class="main">
    <button id="menu-btn" class="btn ghost menu-btn" type="button">☰ Menu</button>
    <div id="conteudo"></div>
  </main>
</div>

<div id="tip" class="tip" hidden></div>
<script src="/app.js"></script>
</body>
</html>
